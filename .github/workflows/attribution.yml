name: Attribution

# Every repository in the organisation calls this workflow on its pull requests,
# so the "no agent attribution in history" rule is checked in one place. A pull
# request squash-merges under its title and description, and GitHub appends a
# Co-authored-by line for each co-author trailer on a branch commit, so the check
# reads all three: the title, the description, and every commit on the branch.
#
# The same job checks that the title and description read well as a commit, as
# Writing style: Commit messages and pull requests describes. GitHub wraps the body
# at 72 characters, which breaks a table row or an inline link, and keeps HTML
# comments and checkboxes as they are. Bots, such as Renovate, write their own
# descriptions, so they skip that step.
#
# Caller, in each repository's .github/workflows/attribution.yml:
#
#   on:
#     pull_request_target:
#       types: [opened, edited, reopened, synchronize]
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     attribution:
#       uses: awesome-humans/.github/.github/workflows/attribution.yml@<sha>
#
# The required status check is then "attribution / check". The caller uses
# pull_request_target, not pull_request, so it runs the base branch's copy of the
# caller and a pull request can't edit the check it's held to. That's safe because
# this job never checks out or runs the pull request's code, and it reads the
# description through the API into a file, never into the shell.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The description is read from the API, not the event payload, so a re-run
      # after an edit checks the current text.
      - name: Check the title, description, and commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A co-author trailer naming an agent or its vendor, and the "Generated with"
          # footer that agent harnesses append. Bots such as Renovate author their own
          # pull requests, which isn't agent attribution, so a [bot] identity passes.
          pattern='^co-authored-by:.*(claude|anthropic|copilot|openai|codex|cursor|gemini|devin)|generated with \[?(claude|copilot|codex|cursor|gemini)'
          found=0

          gh api "repos/$REPO/pulls/$PR" --jq '.title, (.body // "")' > pr.txt
          if grep -inE "$pattern" pr.txt; then
            echo "::error::The pull request title or description carries agent attribution. Remove it, because it becomes the squash commit."
            found=1
          fi

          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | "\(.sha[0:7])\t\(.commit.author.email)\t\(.commit.message | gsub("\n"; "\u001f"))"' > commits.txt
          while IFS=$'\t' read -r sha email message; do
            if grep -qiE 'noreply@anthropic\.com' <<< "$email"; then
              echo "::error::Commit $sha is authored by $email. Commit under the author's git identity."
              found=1
            fi
            if tr '\037' '\n' <<< "$message" | grep -inE "$pattern"; then
              echo "::error::Commit $sha carries agent attribution. Reword it without the trailer or footer, and force-push the branch."
              found=1
            fi
          done < commits.txt

          if [ "$found" -eq 0 ]; then
            echo "No agent attribution in the title, description, or $(wc -l < commits.txt) commits."
          fi
          exit "$found"

      # Runs even when the attribution step fails, so one run reports both.
      - name: Check the title and description read as a commit
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > pr.json
          if [ "$(jq -r '.user.type' pr.json)" = "Bot" ]; then
            echo "A bot opened this pull request, so its description isn't checked."
            exit 0
          fi
          found=0

          # GitHub appends " (#<number>)" to the subject when it squashes.
          title=$(jq -r '.title' pr.json)
          length=$(( ${#title} + ${#PR} + 4 ))
          if [ "$length" -gt 72 ]; then
            echo "::error::The title is $length characters as a commit subject, counting \" (#$PR)\". Shorten it to 72 or fewer."
            found=1
          fi

          # Fenced code blocks and inline code are left out, so a description can
          # show Markdown it's writing about.
          jq -r '.body // ""' pr.json | tr -d '\r' \
            | awk '/^ *(```|~~~)/ { fenced = !fenced; next } !fenced' \
            | sed 's/`[^`]*`//g' > body.txt
          check() {
            if grep -nE "$1" body.txt; then
              echo "::error::The description has $2. $3"
              found=1
            fi
          }
          check '<!--' "an HTML comment" "Delete the template's guidance comment, because it would become part of the commit."
          check '^ *\|.*\|' "a table" "GitHub wraps a table row across lines in the commit. Use a list of **Label:** lines instead."
          check '^ *[-*+] \[[ xX]\]' "a checkbox" "Say what you checked in a sentence instead."
          check '\]\([^)]*\)' "an inline link" "GitHub can wrap a link across lines in the commit. Use an issue reference such as #93, or a reference-style link, [text][1], with [1]: <url> on its own line."

          if [ "$found" -eq 0 ]; then
            echo "The title and description read as a commit."
          fi
          exit "$found"

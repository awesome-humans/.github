name: Attribution

# This repository calls its own reusable workflow, as every other repository does.
# pull_request_target runs the base branch's copy, so a pull request can't edit the
# check it's held to. Nothing here checks out or runs the pull request's code.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the job never checks out the pull request
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    # zizmor's self-repository audit asks for the $/ form, which GitHub added in July
    # 2026. actionlint 1.7.12 rejects that form, so keep ./ until it accepts it.
    uses: ./.github/workflows/attribution.yml # zizmor: ignore[self-repository]
